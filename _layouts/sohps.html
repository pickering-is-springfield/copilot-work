<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Layout</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- LineIcons CSS -->
    <link href="https://cdn.lineicons.com/4.0/lineicons.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #ffffff;
            line-height: 1.6;
            margin: 0;
        }

        /* Navbar uses Bootstrap classes; custom rules to center the brand */
        .navbar-brand { margin: 0 auto; }
        .navbar { border-radius: 0; }

        header {
            background-color: #E55A45;
            color: white;
            padding: 40px 20px;
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            font-family: Georgia, 'Times New Roman', serif;
        }

        /* Use a separate wrapper to avoid colliding with Bootstrap's .container */
        .page {
            margin: 18px; /* white border around blocks like the image */
        }
        .content {
            min-height: 520px; /* match image proportions */
        }
        .content .row { min-height: 520px; align-items: stretch; }

        aside {
            padding: 20px;
            font-weight: bold;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .aside-left {
            background-color: #F6D400; /* bright yellow */
            color: #111;
            font-weight: 700;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 20px;
        }

        main {
            background-color: #63C6F0; /* sky blue */
            padding: 60px 40px; /* larger padding to position text like image */
            color: #111;
            font-family: Georgia, 'Times New Roman', serif;
            font-weight: 400;
            font-size: 16px;
            line-height: 1.15;
        }

        .aside-right {
            background-color: #F37DB0; /* pink */
            color: #111;
            font-weight: 700;
            font-family: Georgia, 'Times New Roman', serif;
            font-size: 20px;
        }

        footer {
            background-color: #7ED321;
            color: white;
            padding: 40px 20px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }

        main p {
            color: #111;
            margin: 0;
        }
        footer {
            background-color: #B7F3A8; /* light green */
            color: #111;
            padding: 28px 20px;
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            font-family: Georgia, 'Times New Roman', serif;
        }

        /* Remove gaps between columns and footer */
        .g-0 > [class*=col-] { padding: 0; }

        /* Ensure asides and main stretch to same height */
        .d-flex.fill { height: 100%; }
        /* Navbar icon sizing */
        .navbar .nav-link i {
            font-size: 22px;
            color: #ffffff;
            line-height: 1;
        }
        .navbar .nav-link:hover i { opacity: 0.85; }
        /* Mobile adjustments: remove outer white margin and prevent overlap */
        @media (max-width: 767.98px) {
            .page { margin: 0; padding: 0; }
            .content .row { min-height: auto; }
            main { padding: 30px 16px; font-size: 20px; }
            .aside-left, .aside-right { padding: 18px; font-size: 18px; }
            body { overflow-x: hidden; }
            .navbar-brand { margin: 0; }
        }
    </style>
</head>
<body>
    <div class="page">
        <nav class="navbar navbar-expand-lg navbar-dark" style="background-color:#1B12FF;">
            <div class="container-fluid">
                <a class="navbar-brand fw-bold" href="#">Link</a>
                <a class="btn btn-light ms-2" href="cats.html" role="button" aria-label="Cats">Cats 🐱</a>
                <a class="btn btn-light ms-2" href="guess.html" role="button" aria-label="Guess">Guess 🎯</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarsocial" aria-controls="navbarsocial" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarsocial">
                    <ul class="navbar-nav ms-auto mb-2 mb-lg-0">
                        <li class="nav-item me-2"><a class="nav-link" href="https://www.youtube.com/" target="_blank" rel="noopener" aria-label="YouTube"><i class="lni lni-youtube"></i></a></li>
                        <li class="nav-item me-2"><a class="nav-link" href="https://www.instagram.com/" target="_blank" rel="noopener" aria-label="Instagram"><i class="lni lni-instagram"></i></a></li>
                        <li class="nav-item"><a class="nav-link" href="https://twitter.com/" target="_blank" rel="noopener" aria-label="Twitter"><i class="lni lni-twitter-original"></i></a></li>
                    </ul>
                </div>
            </div>
        </nav>

        <header class="text-white text-center py-5" style="background-color:#E55A45;">Header</header>

        <div class="container-fluid content">
            <div class="row g-0">
                <aside class="col-12 col-md-2 d-flex align-items-center justify-content-center aside-left">Aside 1</aside>
                <main class="col-12 col-md-8">
                    {{ content }}
                </main>
                <aside class="col-12 col-md-2 d-flex align-items-center justify-content-center aside-right">Aside 2</aside>
            </div>
        </div>

        <footer class="text-center">Footer</footer>
    </div>

        <!-- Bootstrap JS -->
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
